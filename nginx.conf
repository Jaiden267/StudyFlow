map $http_x_forwarded_proto $studyflow_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12M;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # PocketBase admin is deliberately unavailable through the public website.
    location ^~ /_/ { return 404; }

    # The React app and PocketBase API share one origin. This avoids CORS and
    # keeps the database/admin ports private.
    location /api/ {
        proxy_pass http://pocketbase:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $studyflow_forwarded_proto;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # Fallback for React routes such as /dashboard and /assignments/:id.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
